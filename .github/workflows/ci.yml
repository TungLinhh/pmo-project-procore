name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PG_USER: pmo_user
  PG_PASSWORD: pmo_dev_pwd
  PG_DB: pmo

jobs:
  backend-lint:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Workspaces repo: always install from the root (member-level
      # `npm ci` replaces the whole root node_modules per member lockfile).
      - name: Install deps
        run: npm ci
      - name: Lint backend
        run: npm run lint --workspace=backend

  backend-tests:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmo_user
          POSTGRES_PASSWORD: pmo_dev_pwd
          POSTGRES_DB: pmo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pmo_user -d pmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral CI database: literals on purpose. `${{ env.* }}` does NOT
      # reliably resolve inside services.*.env (empty password kills the
      # postgres container, then everything dies with ECONNREFUSED).
      # Backend resolves PG via DB_* parts (same path as docker-compose);
      # tests via PGHOST/PGPORT/….
      DB_HOST: 127.0.0.1
      DB_PORT: '5433'
      DB_USER: pmo_user
      DB_PASSWORD: pmo_dev_pwd
      DB_NAME: pmo
      PGHOST: 127.0.0.1
      PGPORT: '5433'
      PGUSER: pmo_user
      PGPASSWORD: pmo_dev_pwd
      PGDATABASE: pmo
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Workspaces repo: single root install (member-level `npm ci` would
      # replace the whole root node_modules per member lockfile).
      - name: Install deps
        run: npm ci
      # Backend serves frontend/dist unconditionally (backend/src/index.js),
      # and dist/ is git-ignored — build it before starting the server.
      - name: Build frontend
        run: npm run build --workspace=frontend
      - name: Apply migrations
        run: node backend/src/db/init.js
      - name: Start backend
        run: |
          node backend/src/index.js &
          for i in $(seq 1 15); do
            if curl -s http://localhost:3000/api/health > /dev/null; then
              echo "backend ready"
              break
            fi
            sleep 1
          done
      # Order matters: schema.mjs asserts audit_log has rows, so it runs
      # LAST, after the suites that generate audit activity.
      - name: Run E2E suite
        run: |
          node tests/e2e/api.mjs
          node tests/e2e/payment-sla.mjs
          node tests/e2e/shop-approval.mjs
          node tests/e2e/schema.mjs

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Workspaces repo: single root install, then build via workspace.
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build --workspace=frontend
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  schema-audit:
    name: Schema vs SQL audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmo_user
          POSTGRES_PASSWORD: pmo_dev_pwd
          POSTGRES_DB: pmo
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U pmo_user -d pmo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5433'
      DB_USER: pmo_user
      DB_PASSWORD: pmo_dev_pwd
      DB_NAME: pmo
      PGHOST: 127.0.0.1
      PGPORT: '5433'
      PGUSER: pmo_user
      PGPASSWORD: pmo_dev_pwd
      PGDATABASE: pmo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
      - name: Apply migrations (same ordered init.js as everywhere)
        run: node backend/src/db/init.js
      - name: Run schema audit
        run: node tests/tools/schema-audit.mjs || echo "audit found issues — see logs"
